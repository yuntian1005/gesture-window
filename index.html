<!doctype html>
<html lang="zh-CN" data-app-state="ready">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101315" />
    <title>手势窗口</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main class="app-shell" aria-labelledby="app-title">
      <h1 id="app-title" class="visually-hidden">手势窗口</h1>
      <video id="camera-feed" playsinline muted hidden aria-hidden="true"></video>
      <div
        id="renderer"
        class="renderer-mount"
        role="img"
        aria-label="摄像头画面与手势效果"
      ></div>

      <div class="fingertip-overlay" aria-hidden="true">
        <span class="fingertip-marker" data-fingertip-marker hidden></span>
        <span class="fingertip-marker" data-fingertip-marker hidden></span>
        <span class="fingertip-marker" data-fingertip-marker hidden></span>
        <span class="fingertip-marker" data-fingertip-marker hidden></span>
      </div>

      <div class="camera-action">
        <button id="start-camera" class="primary-action" type="button">
          开启摄像头
        </button>
      </div>

      <section class="controls" aria-label="显示控制">
        <fieldset class="segmented-control">
          <legend class="visually-hidden">显示模式</legend>
          <label>
            <input
              type="radio"
              name="display-mode"
              value="invert"
              checked
            />
            <span>反色</span>
          </label>
          <label>
            <input
              type="radio"
              name="display-mode"
              value="rainbow"
            />
            <span>彩虹</span>
          </label>
          <label>
            <input
              type="radio"
              name="display-mode"
              value="mirror"
            />
            <span>镜像</span>
          </label>
        </fieldset>

        <div class="status-row" role="status" aria-live="polite">
          <span class="status-indicator" aria-hidden="true"></span>
          <span id="camera-status">准备就绪</span>
        </div>
        <button
          id="retry-camera"
          class="retry-action"
          type="button"
          hidden
        >
          重试
        </button>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
